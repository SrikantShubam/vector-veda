<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>New Contact Submission</title>
  </head>
  <body style="margin:0;padding:24px;background:#f4f7f6;font-family:Arial,sans-serif;color:#111827;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:700px;margin:0 auto;background:#ffffff;border:1px solid #dfe7e3;border-radius:14px;overflow:hidden;">
      <tr>
        <td style="padding:18px 20px;background:linear-gradient(135deg,#1f4d3b,#2f6b53);color:#ecfdf5;">
          <table role="presentation" cellspacing="0" cellpadding="0" style="border-collapse:collapse;">
            <tr>
              <td style="vertical-align:middle;">
                <img src="{{ params.logo_url }}" width="28" height="28" alt="Vector Veda" style="display:block;border:0;" />
              </td>
              <td style="padding-left:10px;vertical-align:middle;">
                <p style="margin:0;font-size:12px;letter-spacing:0.08em;text-transform:uppercase;opacity:0.9;">Vector Veda</p>
                <h2 style="margin:4px 0 0;font-size:20px;line-height:1.3;">New Contact Form Submission</h2>
              </td>
            </tr>
          </table>
        </td>
      </tr>
      <tr>
        <td style="padding:18px 20px;">
          <img src="{{ params.portfolio_image_url }}" alt="Vector Veda site preview" style="width:100%;height:auto;border:1px solid #dfe7e3;border-radius:12px;display:block;margin:0 0 14px;" />
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="border-collapse:collapse;">
            <tr>
              <td style="padding:9px 0;color:#6b7280;font-size:13px;width:140px;">Name</td>
              <td style="padding:9px 0;color:#111827;font-size:14px;font-weight:600;">{{ params.name }}</td>
            </tr>
            <tr>
              <td style="padding:9px 0;color:#6b7280;font-size:13px;">Email</td>
              <td style="padding:9px 0;color:#111827;font-size:14px;font-weight:600;">{{ params.email }}</td>
            </tr>
            <tr>
              <td style="padding:9px 0;color:#6b7280;font-size:13px;">Company</td>
              <td style="padding:9px 0;color:#111827;font-size:14px;font-weight:600;">{{ params.company }}</td>
            </tr>
            <tr>
              <td style="padding:9px 0;color:#6b7280;font-size:13px;">Submitted</td>
              <td style="padding:9px 0;color:#111827;font-size:14px;font-weight:600;">{{ params.submitted_at }}</td>
            </tr>
          </table>
        </td>
      </tr>
      <tr>
        <td style="padding:0 20px 20px;">
          <p style="margin:0 0 8px;color:#6b7280;font-size:13px;">Message</p>
          <div style="padding:12px 14px;background:#f8faf9;border:1px solid #dfe7e3;border-radius:10px;color:#111827;font-size:14px;line-height:1.55;white-space:pre-wrap;">
            {{ params.message }}
          </div>
        </td>
      </tr>
      <tr>
        <td style="padding:0 20px 18px;">
          <a href="mailto:{{ params.email }}" style="display:inline-block;padding:10px 14px;border-radius:999px;background:#1f4d3b;color:#ecfdf5;text-decoration:none;font-size:13px;font-weight:700;">Reply to {{ params.name }}</a>
        </td>
      </tr>
      <tr>
        <td style="padding:12px 20px;border-top:1px solid #dfe7e3;color:#6b7280;font-size:12px;">
          {{ params.site_url }}
        </td>
      </tr>
    </table>
  </body>
</html>
