<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vector Veda Admin</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #0b130f;
        --panel: rgba(244, 239, 226, 0.92);
        --text: #132117;
        --muted: #516252;
        --accent: #2c6b47;
        --border: rgba(19, 33, 23, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font: 16px/1.6 "Inter", system-ui, sans-serif;
        color: var(--text);
        background:
          radial-gradient(circle at top, rgba(93, 154, 110, 0.25), transparent 36%),
          linear-gradient(180deg, #122018 0%, var(--bg) 100%);
      }

      main {
        width: min(640px, 100%);
        padding: 32px;
        border: 1px solid var(--border);
        border-radius: 28px;
        background: var(--panel);
        box-shadow: 0 28px 80px rgba(0, 0, 0, 0.24);
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(2rem, 5vw, 3rem);
        line-height: 1.05;
      }

      p {
        margin: 0 0 14px;
        color: var(--muted);
      }

      code {
        padding: 2px 8px;
        border-radius: 999px;
        background: rgba(44, 107, 71, 0.08);
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Admin is not built yet.</h1>
      <p>
        Tina Cloud does not currently recognize the branch
        <code>phase4-monolith</code>, so the production admin bundle cannot be
        generated yet.
      </p>
      <p>
        Add or sync that branch inside your Tina Cloud project configuration,
        then run the Tina build again to publish the real <code>/admin</code>
        editor.
      </p>
    </main>
  </body>
</html>
